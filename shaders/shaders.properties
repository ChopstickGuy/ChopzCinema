# ChopzCinema - cinematic shaders for Iris / Oculus with Distant Horizons support

# ---------------------------------------------------------------- vanilla features
oldLighting = false
oldHandLight = false
underwaterOverlay = false
vignette = false
sun = true
moon = true
stars = false
clouds = off
dhClouds = off
dhShadow.enabled = false
separateAo = false
rain.depth = false
beacon.beam.depth = true
frustum.culling = true
shadowTerrain = true
shadowTranslucent = true
shadowEntities = true
shadowBlockEntities = true

# ---------------------------------------------------------------- buffers
size.buffer.colortex5 = 0.5 0.5
size.buffer.colortex7 = 0.5 0.5

# ---------------------------------------------------------------- blending
# G-buffer passes store a material id in alpha -> no blending allowed there
blend.gbuffers_terrain = off
blend.gbuffers_block = off
blend.gbuffers_entities = off
blend.gbuffers_entities_glowing = off
blend.gbuffers_basic = off
blend.gbuffers_skytextured = off
blend.gbuffers_skybasic = off
blend.dh_terrain = off
blend.gbuffers_damagedblock = DST_COLOR SRC_COLOR ZERO ONE

# forward passes: premultiplied-style accumulation into colortex6
blend.gbuffers_water = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_water.colortex4 = off
blend.dh_water = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.dh_water.colortex4 = off
blend.gbuffers_textured = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_textured_lit = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_weather = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_hand = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_hand_water = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_line = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_clouds = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_beaconbeam = SRC_ALPHA ONE ZERO ONE
blend.gbuffers_spidereyes = SRC_ALPHA ONE ZERO ONE
blend.gbuffers_armor_glint = ONE ONE ZERO ONE
blend.shadow = off

# ---------------------------------------------------------------- options menu
screen = <profile> <empty> [CAMERA] [STORY] [ATMOSPHERE] [NIGHTSKY] [LIGHTING] [SHADOWS] [WATER] [RAIN] [HEAT] [MISC]
screen.columns = 2

screen.CAMERA = AUTO_EXPOSURE EXPOSURE TONEMAP COLOR_GRADE GRADE_STRENGTH CONTRAST SATURATION BLOOM BLOOM_STRENGTH LENS_FLARE DEPTH_OF_FIELD DOF_STRENGTH VIGNETTE FILM_GRAIN CHROMATIC_ABERRATION LETTERBOX TAA TAA_SHARPEN
screen.STORY = COLOR_GRADE PAINTERLY FALLING_LEAVES LEAVES_DENSITY WIND_GUSTS WAVING_STRENGTH GOLDEN_ATMOSPHERE KUROSAWA_MODE
screen.ATMOSPHERE = VOLUMETRIC_CLOUDS CIRRUS_CLOUDS CIRRUS_AMOUNT CLOUD_QUALITY CLOUD_HEIGHT CLOUD_THICKNESS CLOUD_COVERAGE CLOUD_SPEED <empty> <empty> VOLUMETRIC_LIGHT VL_SAMPLES VL_STRENGTH FOG_DENSITY MORNING_MIST CAVE_FOG
screen.NIGHTSKY = ROUND_SUN_MOON SUN_SIZE MOON_SIZE <empty> STARS STAR_AMOUNT STAR_BRIGHTNESS MILKY_WAY MILKY_WAY_BRIGHTNESS SHOOTING_STARS AURORA AURORA_CHANCE AURORA_BRIGHTNESS
screen.LIGHTING = SUN_BRIGHTNESS AMBIENT_BRIGHTNESS NIGHT_BRIGHTNESS BLOCKLIGHT_BRIGHTNESS BLOCKLIGHT_TEMP MIN_LIGHT SUBSURFACE_SCATTERING SPECULAR_HIGHLIGHTS
screen.SHADOWS = shadowMapResolution shadowDistance SHADOW_SOFTNESS SHADOW_SAMPLES COLORED_SHADOWS sunPathRotation
screen.WATER = WATER_WAVES WATER_WAVE_HEIGHT WATER_CLARITY WATER_TEXTURE WATER_CAUSTICS UNDERWATER_RAYS SSR SSR_STEPS BLOCK_REFLECTIONS
screen.RAIN = RAIN_STREAK_OPACITY RAIN_RIPPLES RAIN_PUDDLES RAIN_CURTAINS LIGHTNING_FLASH RAIN_MOOD
screen.HEAT = HEAT_HAZE HEAT_HAZE_STRENGTH NETHER_HEAT_HAZE NETHER_LAVA_GLOW NETHER_SMOKE NETHER_SMOKE_DENSITY WAVING_LAVA
screen.MISC = WAVING_PLANTS WAVING_LEAVES WAVING_STRENGTH

sliders = shadowMapResolution shadowDistance sunPathRotation SHADOW_SOFTNESS SHADOW_SAMPLES \
  SUN_BRIGHTNESS AMBIENT_BRIGHTNESS NIGHT_BRIGHTNESS BLOCKLIGHT_BRIGHTNESS BLOCKLIGHT_TEMP MIN_LIGHT \
  CIRRUS_AMOUNT SUN_SIZE MOON_SIZE STAR_AMOUNT STAR_BRIGHTNESS MILKY_WAY_BRIGHTNESS AURORA_CHANCE AURORA_BRIGHTNESS CLOUD_HEIGHT CLOUD_THICKNESS CLOUD_COVERAGE CLOUD_SPEED VL_SAMPLES VL_STRENGTH FOG_DENSITY MORNING_MIST \
  WATER_WAVE_HEIGHT WATER_CLARITY UNDERWATER_RAYS RAIN_STREAK_OPACITY RAIN_MOOD HEAT_HAZE_STRENGTH NETHER_LAVA_GLOW NETHER_SMOKE_DENSITY WATER_TEXTURE SSR_STEPS WAVING_STRENGTH \
  EXPOSURE DOF_STRENGTH PAINTERLY LEAVES_DENSITY GRADE_STRENGTH CONTRAST SATURATION BLOOM_STRENGTH VIGNETTE FILM_GRAIN CHROMATIC_ABERRATION TAA_SHARPEN

profile.LOW = shadowMapResolution=1024 shadowDistance=96.0 SHADOW_SAMPLES=4 CLOUD_QUALITY=0 VL_SAMPLES=6 SSR_STEPS=12 !COLORED_SHADOWS
profile.MEDIUM = shadowMapResolution=1536 shadowDistance=128.0 SHADOW_SAMPLES=8 CLOUD_QUALITY=0 VL_SAMPLES=8 SSR_STEPS=16 COLORED_SHADOWS
profile.HIGH = shadowMapResolution=2048 shadowDistance=160.0 SHADOW_SAMPLES=12 CLOUD_QUALITY=1 VL_SAMPLES=12 SSR_STEPS=20 COLORED_SHADOWS
profile.ULTRA = shadowMapResolution=3072 shadowDistance=224.0 SHADOW_SAMPLES=16 CLOUD_QUALITY=2 VL_SAMPLES=16 SSR_STEPS=28 COLORED_SHADOWS
